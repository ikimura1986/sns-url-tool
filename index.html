<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="apple-mobile-web-app-capable" content="yes">

  <title>SNS URL整形ツール</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
                   "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
      background: #f5f5f5;
      color: #222;
    }

    .container {
      width: 100%;
      max-width: 700px;
      margin: 0 auto;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 22px;
    }

    .description {
      margin: 0 0 22px;
      color: #666;
      font-size: 13px;
      line-height: 1.6;
    }

    .field {
      margin-bottom: 18px;
    }

    .label {
      display: block;
      margin-bottom: 7px;
      font-size: 14px;
      font-weight: bold;
    }

    input,
    textarea {
      width: 100%;
      border: 1px solid #ccc;
      border-radius: 10px;
      background: #fff;
      font-size: 16px;
      -webkit-appearance: none;
    }

    input {
      padding: 14px;
    }

    input:focus,
    textarea:focus {
      outline: none;
      border-color: #555;
    }

    textarea {
      height: 180px;
      padding: 14px;
      line-height: 1.6;
      resize: vertical;
    }

    button {
      width: 100%;
      margin-top: 12px;
      padding: 15px;
      border: none;
      border-radius: 10px;
      background: #111;
      color: #fff;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    button:active {
      opacity: 0.7;
    }

    .clear {
      background: #ddd;
      color: #222;
    }

    #message {
      min-height: 24px;
      margin-top: 10px;
      text-align: center;
      font-size: 14px;
      font-weight: bold;
    }

    .success {
      color: #16803c;
    }

    .error {
      color: #d22;
    }
  </style>
</head>

<body>

<div class="container">

  <h1>SNS URL整形ツール</h1>

  <p class="description">
    Threads / X の投稿URLを貼り付けるだけで自動生成します。
  </p>


  <!-- 投稿URL -->

  <div class="field">

    <label class="label" for="postUrl">
      投稿URL
    </label>

    <input
      type="url"
      id="postUrl"
      placeholder="Threads / X の投稿URLを貼り付け"
      autocomplete="off"
      autocapitalize="none"
      spellcheck="false"
    >

  </div>


  <!-- ネタ提案者 -->

  <div class="field">

    <label class="label" for="proposer">
      ネタ提案者名
    </label>

    <input
      type="text"
      id="proposer"
      placeholder="例：イッコウ"
      autocomplete="off"
    >

  </div>


  <!-- 出力 -->

  <div class="field">

    <label class="label" for="output">
      出力
    </label>

    <textarea
      id="output"
      readonly
      placeholder="投稿URLを貼り付けると自動生成されます"
    ></textarea>

  </div>


  <button id="copyButton">
    コピー
  </button>

  <button id="clearButton" class="clear">
    クリア
  </button>

  <div id="message"></div>

</div>


<script>

const postUrl =
  document.getElementById("postUrl");

const proposer =
  document.getElementById("proposer");

const output =
  document.getElementById("output");

const copyButton =
  document.getElementById("copyButton");

const clearButton =
  document.getElementById("clearButton");

const message =
  document.getElementById("message");


/* ========================================
   URLクリーンアップ
   ?以降・#以降・末尾の/を削除
======================================== */

function cleanUrl(url) {

  try {

    const parsed =
      new URL(url.trim());

    // ?以降を削除
    parsed.search = "";

    // #以降を削除
    parsed.hash = "";

    // 末尾の / を削除
    parsed.pathname =
      parsed.pathname.replace(/\/+$/, "");

    return parsed.toString();

  } catch (e) {

    return "";

  }

}


/* ========================================
   投稿者プロフィールURL取得
======================================== */

function getProfileUrl(url) {

  try {

    const parsed =
      new URL(url);

    const hostname =
      parsed.hostname
        .toLowerCase()
        .replace(/^www\./, "");


    /* =====================================
       Threads
    ===================================== */

    if (
      hostname === "threads.com" ||
      hostname === "threads.net"
    ) {

      /*
        例：

        https://www.threads.com/
        @ru_mama12/post/DdRF2wek2rK

        ↓

        https://www.threads.com/@ru_mama12
      */

      const match =
        parsed.pathname.match(
          /^\/(@[^/]+)\/post\/[^/]+/
        );


      if (!match) {

        return "";

      }


      return (
        "https://www.threads.com/" +
        match[1]
      );

    }


    /* =====================================
       X / Twitter
    ===================================== */

    if (
      hostname === "x.com" ||
      hostname === "twitter.com"
    ) {

      /*
        例：

        https://x.com/example/status/123456

        ↓

        https://x.com/example
      */

      const match =
        parsed.pathname.match(
          /^\/([^/]+)\/status\/[^/]+/
        );


      if (!match) {

        return "";

      }


      return (
        "https://x.com/" +
        match[1]
      );

    }


    return "";

  } catch (e) {

    return "";

  }

}


/* ========================================
   テンプレート生成
======================================== */

function createTemplate(
  cleanedPostUrl,
  profileUrl,
  proposerName
) {

  /*
    正式テンプレート

    【ソース1】
    【ソース2】
    【ソース3】
    関連URL：
    【トピック】
    【編集部】第二
    【執筆／引取予定】
    【ネタ提案者】
    【集計用タグ】
    【許諾種】要許諾　イレギュラー　不要
    【連絡先1】
    【掲載注意／誘導】
    【制作注意】
    【許諾注意】許諾文：
    参考記事：

    実際の出力は改行なし
  */

  return (
    `【ソース1】${cleanedPostUrl}` +
    `【ソース2】` +
    `【ソース3】` +
    `関連URL：${profileUrl}` +
    `【トピック】` +
    `【編集部】第二` +
    `【執筆／引取予定】 ` +
    `【ネタ提案者】${proposerName} ` +
    `【集計用タグ】` +
    `【許諾種】要許諾　イレギュラー　不要` +
    `【連絡先1】${profileUrl}` +
    `【掲載注意／誘導】 ` +
    `【制作注意】 ` +
    `【許諾注意】許諾文： ` +
    `参考記事：`
  );

}


/* ========================================
   自動生成
======================================== */

function generate() {

  const originalUrl =
    postUrl.value.trim();

  const proposerName =
    proposer.value.trim();


  message.textContent = "";
  message.className = "";


  /* 投稿URLが空の場合 */

  if (!originalUrl) {

    output.value = "";

    return;

  }


  /* URLクリーンアップ */

  const cleanedPostUrl =
    cleanUrl(originalUrl);


  if (!cleanedPostUrl) {

    output.value = "";

    message.textContent =
      "URLを確認してください";

    message.className =
      "error";

    return;

  }


  /* 投稿者URL取得 */

  const profileUrl =
    getProfileUrl(cleanedPostUrl);


  if (!profileUrl) {

    output.value = "";

    message.textContent =
      "Threads または X の投稿URLを確認してください";

    message.className =
      "error";

    return;

  }


  /* テンプレート生成 */

  output.value =
    createTemplate(
      cleanedPostUrl,
      profileUrl,
      proposerName
    );

}


/* ========================================
   投稿URL入力時
======================================== */

postUrl.addEventListener(
  "input",
  generate
);


/* ========================================
   ネタ提案者入力時
======================================== */

proposer.addEventListener(
  "input",
  generate
);


/* ========================================
   スマホ貼り付け対策
======================================== */

postUrl.addEventListener(
  "paste",
  function() {

    setTimeout(
      generate,
      0
    );

  }
);


/* ========================================
   コピー
======================================== */

copyButton.addEventListener(
  "click",
  async function() {


    if (!output.value) {

      message.textContent =
        "先に投稿URLを入力してください";

      message.className =
        "error";

      return;

    }


    try {

      await navigator.clipboard.writeText(
        output.value
      );


      message.textContent =
        "コピーしました！";

      message.className =
        "success";


    } catch (e) {


      /*
        iPhone等で
        Clipboard APIが使えない場合
      */

      output.removeAttribute(
        "readonly"
      );

      output.focus();

      output.select();

      output.setSelectionRange(
        0,
        output.value.length
      );


      document.execCommand(
        "copy"
      );


      output.setAttribute(
        "readonly",
        ""
      );


      message.textContent =
        "コピーしました！";

      message.className =
        "success";

    }

  }
);


/* ========================================
   クリア
======================================== */

clearButton.addEventListener(
  "click",
  function() {


    postUrl.value = "";

    proposer.value = "";

    output.value = "";

    message.textContent = "";

    message.className = "";


    postUrl.focus();

  }
);

</script>

</body>
</html>
