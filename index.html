<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="apple-mobile-web-app-capable" content="yes">

  <title>SNS URL整形ツール</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
                   "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
      background: #f5f5f5;
      color: #222;
    }

    .container {
      width: 100%;
      max-width: 700px;
      margin: 0 auto;
    }

    h1 {
      margin: 0 0 18px;
      font-size: 22px;
    }

    .label {
      display: block;
      margin-bottom: 7px;
      font-size: 14px;
      font-weight: bold;
    }

    input,
    textarea {
      width: 100%;
      border: 1px solid #ccc;
      border-radius: 10px;
      background: #fff;
      font-size: 16px;
      -webkit-appearance: none;
    }

    input {
      padding: 14px;
    }

    textarea {
      height: 220px;
      margin-top: 16px;
      padding: 14px;
      line-height: 1.7;
      resize: vertical;
    }

    button {
      width: 100%;
      margin-top: 12px;
      padding: 15px;
      border: none;
      border-radius: 10px;
      background: #111;
      color: #fff;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    button:active {
      opacity: 0.7;
    }

    .clear {
      background: #ddd;
      color: #222;
    }

    #message {
      min-height: 24px;
      margin-top: 10px;
      text-align: center;
      font-size: 14px;
      font-weight: bold;
    }

    .success {
      color: #16803c;
    }

    .error {
      color: #d22;
    }
  </style>
</head>

<body>

<div class="container">

  <h1>SNS URL整形ツール</h1>

  <label class="label" for="postUrl">
    Threads / X / TikTok の投稿URL
  </label>

  <input
    type="url"
    id="postUrl"
    placeholder="投稿URLを貼り付け"
    autocomplete="off"
    autocapitalize="none"
    spellcheck="false"
  >

  <textarea
    id="output"
    readonly
    placeholder="投稿URLを貼り付けると、ここに自動生成されます"
  ></textarea>

  <button id="copyButton">
    コピー
  </button>

  <button id="clearButton" class="clear">
    クリア
  </button>

  <div id="message"></div>

</div>

<script>

const postUrl = document.getElementById("postUrl");
const output = document.getElementById("output");
const copyButton = document.getElementById("copyButton");
const clearButton = document.getElementById("clearButton");
const message = document.getElementById("message");


/* URLの ?以降・#以降を削除 */

function cleanUrl(url) {

  try {

    const parsed = new URL(url.trim());

    parsed.search = "";
    parsed.hash = "";

    parsed.pathname =
      parsed.pathname.replace(/\/+$/, "");

    return parsed.toString();

  } catch (e) {

    return "";

  }

}


/* 投稿者プロフィールURLを抽出 */

function getProfileUrl(url) {

  try {

    const parsed = new URL(url);

    const hostname =
      parsed.hostname.toLowerCase().replace(/^www\./, "");


    /* Threads */

    if (
      hostname === "threads.com" ||
      hostname === "threads.net"
    ) {

      const match =
        parsed.pathname.match(/^\/(@[^/]+)/);

      if (!match) {
        return "";
      }

      return "https://www.threads.com/" + match[1];

    }


    /* X / Twitter */

    if (
      hostname === "x.com" ||
      hostname === "twitter.com"
    ) {

      const match =
        parsed.pathname.match(
          /^\/([^/]+)\/status\/[^/]+/
        );

      if (!match) {
        return "";
      }

      return "https://x.com/" + match[1];

    }


    /* TikTok */

    if (
      hostname === "tiktok.com" ||
      hostname === "m.tiktok.com"
    ) {

      const match =
        parsed.pathname.match(
          /^\/(@[^/]+)\/(?:video|photo)\/[^/]+/
        );

      if (!match) {
        return "";
      }

      return "https://www.tiktok.com/" + match[1];

    }


    return "";

  } catch (e) {

    return "";

  }

}


/* テンプレート生成 */

function generate() {

  const originalUrl = postUrl.value.trim();

  message.textContent = "";
  message.className = "";

  if (!originalUrl) {

    output.value = "";
    return;

  }


  const cleanedUrl = cleanUrl(originalUrl);

  if (!cleanedUrl) {

    output.value = "";

    message.textContent =
      "URLを確認してください";

    message.className = "error";

    return;

  }


  const profileUrl =
    getProfileUrl(cleanedUrl);


  if (!profileUrl) {

    output.value = "";

    message.textContent =
      "Threads / X / TikTok の投稿URLを確認してください";

    message.className = "error";

    return;

  }


  /* 改行なしで出力 */

  output.value =
    `【ソース1】${cleanedUrl}` +
    `【ソース2】` +
    `【ソース3】` +
    `関連URL：${profileUrl}` +
    `【トピック】` +
    `【編集部】第二` +
    `【執筆／引取予定】 ` +
    `【ネタ提案者】 ` +
    `【集計用タグ】` +
    `【許諾種】要許諾` +
    `【連絡先1】${profileUrl}` +
    `【掲載注意／誘導】 ` +
    `【制作注意】 ` +
    `【許諾注意】許諾文： ` +
    `参考記事：`;

}


/* 入力時に自動生成 */

postUrl.addEventListener("input", generate);

postUrl.addEventListener("paste", function() {
  setTimeout(generate, 0);
});


/* コピー */

copyButton.addEventListener("click", async function() {

  if (!output.value) {

    message.textContent =
      "先に投稿URLを入力してください";

    message.className = "error";

    return;

  }

  try {

    await navigator.clipboard.writeText(output.value);

    message.textContent = "コピーしました！";
    message.className = "success";

  } catch (e) {

    output.removeAttribute("readonly");

    output.focus();
    output.select();

    output.setSelectionRange(
      0,
      output.value.length
    );

    document.execCommand("copy");

    output.setAttribute("readonly", "");

    message.textContent = "コピーしました！";
    message.className = "success";

  }

});


/* クリア */

clearButton.addEventListener("click", function() {

  postUrl.value = "";
  output.value = "";

  message.textContent = "";
  message.className = "";

  postUrl.focus();

});

</script>

</body>
</html>
