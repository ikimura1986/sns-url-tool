<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="apple-mobile-web-app-capable" content="yes">

  <title>SNS URL整形ツール</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
                   "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
      background: #f5f5f5;
      color: #222;
    }

    .container {
      width: 100%;
      max-width: 700px;
      margin: 0 auto;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 22px;
    }

    .description {
      margin: 0 0 24px;
      color: #666;
      font-size: 13px;
      line-height: 1.6;
    }

    .field {
      margin-bottom: 18px;
    }

    .label {
      display: block;
      margin-bottom: 7px;
      font-size: 14px;
      font-weight: bold;
    }

    .note {
      display: block;
      margin-top: 6px;
      color: #777;
      font-size: 12px;
    }

    input,
    textarea {
      width: 100%;
      border: 1px solid #ccc;
      border-radius: 10px;
      background: #fff;
      font-size: 16px;
      -webkit-appearance: none;
    }

    input {
      padding: 14px;
    }

    input:focus,
    textarea:focus {
      outline: none;
      border-color: #555;
    }

    textarea {
      height: 180px;
      padding: 14px;
      line-height: 1.6;
      resize: vertical;
    }

    button {
      width: 100%;
      margin-top: 12px;
      padding: 15px;
      border: none;
      border-radius: 10px;
      background: #111;
      color: #fff;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    button:active {
      opacity: 0.7;
    }

    .clear {
      background: #ddd;
      color: #222;
    }

    #message {
      min-height: 24px;
      margin-top: 10px;
      text-align: center;
      font-size: 14px;
      font-weight: bold;
    }

    .success {
      color: #16803c;
    }

    .error {
      color: #d22;
    }

    .threads-area {
      transition: opacity 0.2s;
    }

    .threads-area.disabled {
      opacity: 0.4;
    }
  </style>
</head>

<body>

<div class="container">

  <h1>SNS URL整形ツール</h1>

  <p class="description">
    Xは投稿URLだけでOK。<br>
    Threadsは投稿URLと投稿者URLの2つを入力してください。
  </p>


  <!-- 投稿URL -->

  <div class="field">

    <label class="label" for="postUrl">
      投稿URL
    </label>

    <input
      type="url"
      id="postUrl"
      placeholder="Threads / X の投稿URLを貼り付け"
      autocomplete="off"
      autocapitalize="none"
      spellcheck="false"
    >

  </div>


  <!-- Threads投稿者URL -->

  <div class="field threads-area" id="threadsArea">

    <label class="label" for="threadsProfileUrl">
      Threads 投稿者URL
    </label>

    <input
      type="url"
      id="threadsProfileUrl"
      placeholder="https://www.threads.com/@ユーザー名"
      autocomplete="off"
      autocapitalize="none"
      spellcheck="false"
    >

    <span class="note">
      ※Threadsの場合のみ入力してください
    </span>

  </div>


  <!-- 出力 -->

  <div class="field">

    <label class="label" for="output">
      出力
    </label>

    <textarea
      id="output"
      readonly
      placeholder="必要なURLを入力すると自動生成されます"
    ></textarea>

  </div>


  <button id="copyButton">
    コピー
  </button>

  <button id="clearButton" class="clear">
    クリア
  </button>

  <div id="message"></div>

</div>


<script>

const postUrl =
  document.getElementById("postUrl");

const threadsProfileUrl =
  document.getElementById("threadsProfileUrl");

const threadsArea =
  document.getElementById("threadsArea");

const output =
  document.getElementById("output");

const copyButton =
  document.getElementById("copyButton");

const clearButton =
  document.getElementById("clearButton");

const message =
  document.getElementById("message");


/* ========================================
   URLクリーンアップ
   ?以降、#以降、末尾の/を削除
======================================== */

function cleanUrl(url) {

  try {

    const parsed =
      new URL(url.trim());

    parsed.search = "";
    parsed.hash = "";

    parsed.pathname =
      parsed.pathname.replace(/\/+$/, "");

    return parsed.toString();

  } catch (e) {

    return "";

  }

}


/* ========================================
   SNS判定
======================================== */

function getSNS(url) {

  try {

    const parsed =
      new URL(url);

    const hostname =
      parsed.hostname
        .toLowerCase()
        .replace(/^www\./, "");


    /* Threads */

    if (
      hostname === "threads.com" ||
      hostname === "threads.net"
    ) {

      return "threads";

    }


    /* X */

    if (
      hostname === "x.com" ||
      hostname === "twitter.com"
    ) {

      return "x";

    }


    return "";

  } catch (e) {

    return "";

  }

}


/* ========================================
   XプロフィールURL抽出
======================================== */

function getXProfileUrl(url) {

  try {

    const parsed =
      new URL(url);

    /*
      /username/status/123456
    */

    const match =
      parsed.pathname.match(
        /^\/([^/]+)\/status\/[^/]+/
      );


    if (!match) {

      return "";

    }


    const username =
      match[1];


    return "https://x.com/" + username;

  } catch (e) {

    return "";

  }

}


/* ========================================
   ThreadsプロフィールURLを整形
======================================== */

function getThreadsProfileUrl(url) {

  try {

    const cleaned =
      cleanUrl(url);

    if (!cleaned) {

      return "";

    }


    const parsed =
      new URL(cleaned);

    const hostname =
      parsed.hostname
        .toLowerCase()
        .replace(/^www\./, "");


    if (
      hostname !== "threads.com" &&
      hostname !== "threads.net"
    ) {

      return "";

    }


    /*
      /@username
      /@username/～

      どちらでもユーザー名だけ取得
    */

    const match =
      parsed.pathname.match(
        /^\/(@[^/]+)/
      );


    if (!match) {

      return "";

    }


    return (
      "https://www.threads.com/" +
      match[1]
    );

  } catch (e) {

    return "";

  }

}


/* ========================================
   テンプレート作成
======================================== */

function createTemplate(
  cleanedPostUrl,
  profileUrl
) {

  /*
    改行なし・完全1行
  */

  return (
    `【ソース1】${cleanedPostUrl}` +
    `【ソース2】` +
    `【ソース3】` +
    `関連URL：${profileUrl}` +
    `【トピック】` +
    `【編集部】第二` +
    `【執筆／引取予定】 ` +
    `【ネタ提案者】 ` +
    `【集計用タグ】` +
    `【許諾種】要許諾` +
    `【連絡先1】${profileUrl}` +
    `【掲載注意／誘導】 ` +
    `【制作注意】 ` +
    `【許諾注意】許諾文： ` +
    `参考記事：`
  );

}


/* ========================================
   メイン処理
======================================== */

function generate() {

  const originalPostUrl =
    postUrl.value.trim();


  message.textContent = "";
  message.className = "";


  /* 投稿URLが空 */

  if (!originalPostUrl) {

    output.value = "";

    threadsArea.classList.remove(
      "disabled"
    );

    return;

  }


  /* 投稿URLをクリーンアップ */

  const cleanedPostUrl =
    cleanUrl(originalPostUrl);


  if (!cleanedPostUrl) {

    output.value = "";

    message.textContent =
      "投稿URLを確認してください";

    message.className =
      "error";

    return;

  }


  /* SNS判定 */

  const sns =
    getSNS(cleanedPostUrl);


  /* ========================================
     X
  ======================================== */

  if (sns === "x") {

    threadsArea.classList.add(
      "disabled"
    );


    const profileUrl =
      getXProfileUrl(
        cleanedPostUrl
      );


    if (!profileUrl) {

      output.value = "";

      message.textContent =
        "Xの投稿URLを確認してください";

      message.className =
        "error";

      return;

    }


    output.value =
      createTemplate(
        cleanedPostUrl,
        profileUrl
      );


    return;

  }


  /* ========================================
     Threads
  ======================================== */

  if (sns === "threads") {

    threadsArea.classList.remove(
      "disabled"
    );


    const originalProfileUrl =
      threadsProfileUrl.value.trim();


    /*
      投稿者URLがまだ未入力
    */

    if (!originalProfileUrl) {

      output.value = "";

      message.textContent =
        "Threadsの投稿者URLを入力してください";

      message.className =
        "error";

      return;

    }


    const profileUrl =
      getThreadsProfileUrl(
        originalProfileUrl
      );


    if (!profileUrl) {

      output.value = "";

      message.textContent =
        "Threadsの投稿者URLを確認してください";

      message.className =
        "error";

      return;

    }


    output.value =
      createTemplate(
        cleanedPostUrl,
        profileUrl
      );


    return;

  }


  /* ========================================
     対象外
  ======================================== */

  output.value = "";

  message.textContent =
    "Threads または X のURLを入力してください";

  message.className =
    "error";

}


/* ========================================
   入力時に自動生成
======================================== */

postUrl.addEventListener(
  "input",
  generate
);

threadsProfileUrl.addEventListener(
  "input",
  generate
);


/* スマホ貼り付け対策 */

postUrl.addEventListener(
  "paste",
  function() {

    setTimeout(
      generate,
      0
    );

  }
);


threadsProfileUrl.addEventListener(
  "paste",
  function() {

    setTimeout(
      generate,
      0
    );

  }
);


/* ========================================
   コピー
======================================== */

copyButton.addEventListener(
  "click",
  async function() {


    if (!output.value) {

      message.textContent =
        "必要なURLを入力してください";

      message.className =
        "error";

      return;

    }


    try {

      await navigator.clipboard.writeText(
        output.value
      );


      message.textContent =
        "コピーしました！";

      message.className =
        "success";


    } catch (e) {


      /*
        iPhone等の
        Clipboard API非対応時
      */

      output.removeAttribute(
        "readonly"
      );

      output.focus();

      output.select();

      output.setSelectionRange(
        0,
        output.value.length
      );


      document.execCommand(
        "copy"
      );


      output.setAttribute(
        "readonly",
        ""
      );


      message.textContent =
        "コピーしました！";

      message.className =
        "success";

    }

  }
);


/* ========================================
   クリア
======================================== */

clearButton.addEventListener(
  "click",
  function() {


    postUrl.value = "";

    threadsProfileUrl.value = "";

    output.value = "";

    message.textContent = "";

    message.className = "";

    threadsArea.classList.remove(
      "disabled"
    );


    postUrl.focus();

  }
);

</script>

</body>
</html>
